[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; --- WAŻNE: OPTYMALIZACJA PAMIĘCI ---
; huge_app.csv daje ~3MB na kod aplikacji (zamiast 1.2MB).
; Kod v24+ jest spory, więc to jest KONIECZNE, żeby się zmieścił!
board_build.partitions = huge_app.csv

; --- KONFIGURACJA USB (Dla ESP32-C3 SuperMini) ---
; To sprawia, że Serial.print idzie prosto do konsoli przez USB
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; --- BIBLIOTEKI ---
lib_deps =
    ; Serwer WWW – fork mathieucarbou, stabilny na nowych ESP32
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git

    ; RTC DS3231 (I2C)
    adafruit/RTClib @ ^2.1.3

    ; --- MODUŁ ROZSZERZAJĄCY DAC/ADC/GPIO (v24+) ---
    ; MCP4728 – 4-kanałowy 12-bit DAC I2C (mixer kolorów 3K/4K)
    ; Adafruit_BusIO jest wymaganą zależnością, PlatformIO pobiera automatycznie
    adafruit/Adafruit_MCP4728 @ ^1.0.3

    ; MCP3202 – 2-kanałowy 12-bit ADC SPI
    ; Biblioteka RobTillaart obsługuje całą rodzinę MCP320x, w tym MCP3202
    robtillaart/MCP_ADC @ ^0.5.0

    ; TCA9536 – 4-bitowy ekspander GPIO I2C (TI, pin-compatible z PCA9536)
    ; Biblioteka SparkFun jawnie wspiera TCA9536 / PCA9536
    sparkfun/SparkFun I2C Expander Arduino Library @ ^1.0.1

    ; Wire – I2C bus (wbudowane w ESP32 Arduino, wymuszamy dla pewności)
    Wire
    ; SPI – wymagane przez MCP_ADC (wbudowane w ESP32 Arduino)
    SPI

; --- USTAWIENIA KOMPILATORA ---
; Ignorujemy wbudowany WebServer, bo używamy Asynca
lib_ignore = WebServer
; Głębokie szukanie zależności (naprawia błędy linkera)
lib_ldf_mode = deep

; --- USTAWIENIA PORTU ---
; Zapobiega resetowaniu płytki przy otwarciu monitora (Kluczowe dla C3!)
monitor_dtr = 0
monitor_rts = 0

; Porty - upewnij się, że to Twój numer!
upload_port = COM17
monitor_port = COM17
